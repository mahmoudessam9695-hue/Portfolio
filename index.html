<!DOCTYPE html>
<html>
<head>
  <base href="/Portfolio/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mahmoud Essam - Flutter Developer Portfolio">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mahmoud_essam">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mahmoud Essam | Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <!-- فلاتر لودر عشان نتحكم في الـ Renderer -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // تحميل محرك فلاتر مع إجبار استخدام HTML renderer للموبايل
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: "1", // ده بيساعد في تحديث النسخة عند المستخدمين
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            renderer: "html", 
          }).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
