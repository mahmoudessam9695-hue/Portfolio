<!DOCTYPE html>
<html>
<head>
  <!-- ده السطر اللي بيعرف المتصفح مكان الفولدر الأساسي -->
  <base href="/Portfolio/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mahmoud Essam - Flutter Developer Portfolio">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mahmoud_essam">
  
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mahmoud Essam | Portfolio</title>
  
  <!-- استدعينا المانيفست بمسار نسبي عشان ميحصلش 404 -->
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- السكريبت ده هو اللي بيقوم الليلة كلها في النسخ الجديدة -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // تعديل خاص عشان الـ Renderer يشتغل صح مع مسار الـ Portfolio
    window.addEventListener('load', function(ev) {
      if (window._flutter) {
        _flutter.loader.loadEntrypoint({
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine({
              renderer: "html", // ده اللي هيشغل الموقع على الموبايل بسلاسة
            }).then(function(appRunner) {
              appRunner.runApp();
            });
          }
        });
      }
    });
  </script>
</body>
</html>
