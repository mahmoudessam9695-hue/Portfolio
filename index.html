<!DOCTYPE html>
<html>
<head>
  <!-- تأكد أن اسم الفولدر على جيت هاب هو Portfolio بنفس حالة الأحرف -->
  <base href="/Portfolio/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mahmoud Essam - Flutter Developer Portfolio">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mahmoud_essam">
  
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mahmoud Essam | Portfolio</title>
  
  <!-- استدعاء المانيفست بمسار نقطي لضمان بقائه داخل المجلد الحالي -->
  <link rel="manifest" href="./manifest.json">

  <!-- استدعاء ملف البوتستراب بمسار نقطي أيضاً -->
  <script src="./flutter_bootstrap.js" async></script>
</head>
<body>
  <script>
    // هذا الكود يضمن تحميل المحرك حتى لو فشل البوتستراب في التعرف على المسار
    window.addEventListener('load', function(ev) {
      if (window._flutter && window._flutter.loader) {
        _flutter.loader.loadEntrypoint({
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine({
              renderer: "html", // لضمان العمل على الموبايل
            }).then(function(appRunner) {
              appRunner.runApp();
            });
          }
        });
      }
    });
  </script>
</body>
</html>
